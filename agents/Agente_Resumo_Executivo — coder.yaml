  - 5 a 7 bullets
  - 1 parágrafo "O que mudou"
  - 1 parágrafo "Impacto imediato"
  - Linguagem simples, sem juridiquês

  Nunca inclua detalhes técnicos profundos.
examples: []
style:
  creativity: medium
  precision: high
